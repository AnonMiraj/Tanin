name: Build Release and Publish

# Trigger the workflow when a tag starting with 'v' is pushed, or manually triggered
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: tanin

jobs:
  # JOB 1: Build Binaries & Upload to GitHub Releases
  build-and-upload:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux x86_64 (Standard glibc) ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_extension: .tar.gz

          # --- Linux ARM64 (Raspberry Pi 4/5, native ARM64 runner) ---
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_extension: .tar.gz

          # --- macOS ARM (Apple Silicon) ---
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_extension: .tar.gz

          # --- macOS Intel (x86_64) ---
          # NOTE: macos-13 is GitHub's native x86_64 runner, ensuring native compilation
          # without cross-compilation linking issues against Homebrew C libraries.
          - os: macos-13
            target: x86_64-apple-darwin
            asset_extension: .tar.gz

    steps:
      - uses: actions/checkout@v7

      # --- SYSTEM DEPENDENCIES ---
      # Linux requires:
      # pkg-config libasound2-dev libjack-jackd2-dev libssl-dev libopus-dev
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libjack-jackd2-dev libssl-dev libopus-dev

      # macOS requires:
      # pkg-config opus jack
      # Note: native-tls uses Apple's native Security framework on macOS (no OpenSSL needed)
      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config opus jack

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release
        run: cargo build --release --locked --verbose --target ${{ matrix.target }}

      # --- PACKAGING STEP ---
      - name: Package Artifacts
        shell: bash
        run: |
          # 1. Create a staging directory
          mkdir staging

          # 2. Copy the binary to staging and ensure executable permissions
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" staging/
          chmod +x "staging/${{ env.BINARY_NAME }}"

          # 3. Copy documentation and licensing
          cp README.md LICENSE SOUNDS_LICENSING.md ADDING_SOUNDS.md staging/

          # 4. Create the Archive
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            RELEASE_TAG="manual"
          fi
          RELEASE_NAME="${{ env.BINARY_NAME }}-${RELEASE_TAG}-${{ matrix.target }}${{ matrix.asset_extension }}"

          cd staging
          tar -czvf "../$RELEASE_NAME" *
          cd ..

          # 5. Save the name for the upload step
          echo "ASSET_PATH=$RELEASE_NAME" >> $GITHUB_ENV

      # --- UPLOAD STEP ---
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET_PATH }}

  # JOB 2: Publish to Crates.io
  publish-crate:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    needs: build-and-upload # Wait for binaries to build and upload before publishing
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Check for Crates.io Token
        id: check-token
        run: |
          if [ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::CARGO_REGISTRY_TOKEN is not set. Skipping publishing to crates.io."
          fi

      - name: Install Linux Dependencies
        if: steps.check-token.outputs.has_token == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libjack-jackd2-dev libssl-dev libopus-dev

      - name: Install Rust toolchain
        if: steps.check-token.outputs.has_token == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        if: steps.check-token.outputs.has_token == 'true'
        uses: swatinem/rust-cache@v2

      - name: Publish to Crates.io
        if: steps.check-token.outputs.has_token == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

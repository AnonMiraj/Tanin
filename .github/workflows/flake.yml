name: Flake

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The flake has to evaluate on every system it claims to support, even before
  # a release exists.
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --all-systems --no-build

  # packages.tanin-bin is a fetchurl pinned by the version in Cargo.toml, so a
  # hash that does not match the published asset, or an asset that is missing,
  # fails the build instead of silently shipping a wrong pin.
  hashes:
    name: Verify hashes (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - uses: actions/checkout@v7

      # The hashes can only be updated once the release assets exist, so there
      # is nothing to compare against until v<version> is published.
      - name: Check for a v<version> release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v${version} is not published yet, skipping the hash check."
          fi

      - uses: cachix/install-nix-action@v31
        if: steps.release.outputs.found == 'true'

      - name: Build the prebuilt package
        if: steps.release.outputs.found == 'true'
        run: nix build .#tanin-bin --no-link --print-out-paths
